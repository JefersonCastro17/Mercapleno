sonar.projectKey=Mercapleno
sonar.projectName=Mercapleno
sonar.projectVersion=2.0.0

# Archivos fuente a analizar
sonar.sources=src
sonar.tests=tester
sonar.test.inclusions=tester/**/*.spec.ts,tester/**/*.test.ts

# Exclusiones de código no ejecutable
sonar.exclusions=dist/**,coverage/**,reports/**,node_modules/**,scripts/**,**/*.module.ts,src/main.ts,src/**/*.dto.ts,src/types/**

# Reporte de cobertura generado por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
